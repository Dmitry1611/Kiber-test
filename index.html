<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина по Кибербезопасности</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .quiz-card { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 500px; padding: 25px; text-align: center; }
        .header { margin-bottom: 20px; }
        .header h1 { font-size: 22px; color: #1e3c72; margin-bottom: 5px; }
        .header p { font-size: 14px; color: #666; }
        .progress-bar { background: #e0e0e0; border-radius: 10px; height: 10px; overflow: hidden; margin-bottom: 20px; }
        .progress { background: #4caf50; height: 100%; width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 17px; font-weight: 600; color: #333; margin-bottom: 20px; text-align: left; min-height: 50px; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px; padding: 14px 16px; font-size: 15px; text-align: left; color: #333; cursor: pointer; transition: all 0.2s ease; }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; font-weight: bold; }
        .result-screen { display: none; }
        .score-box { font-size: 48px; font-weight: bold; color: #1e3c72; margin: 15px 0; }
        .grade-box { font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        .restart-btn { background: #1e3c72; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        .restart-btn:hover { background: #2a5298; }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div id="quiz-screen">
            <div class="header">
                <h1>🔒 Кибербезопасность</h1>
                <p>Проект по информатике (7 класс)</p>
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="question-text" id="question-text">Загрузка вопроса...</div>
            <div class="options-container" id="options-container"></div>
        </div>

        <div class="result-screen" id="result-screen">
            <h2>🎉 Тест завершён!</h2>
            <div class="score-box" id="score-text">0 / 5</div>
            <div class="grade-box" id="grade-text">Оценка: -</div>
            <p id="feedback-text" style="color: #666; margin-bottom: 20px;"></p>
            <button class="restart-btn" onclick="restartQuiz()">Пройти ещё раз</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "какой из этих паролей является наиболее надёжным?",
                options: ["12345678", "Dima2013", "K8#mQ9!vL2", "password123"],
                correct: 2
            },
            {
                q: "Что такое фишинг в интернете?",
                options: [
                    "Быстрое скачивание видео",
                    "Кража паролей через поддельные сайты",
                    "Очистка смартфона от вирусов",
                    "Онлайн-игра про рыбалку"
                ],
                correct: 1
            },
            {
                q: "Пришло сообщение от друга: «Голосуй за меня по ссылке!». Твои действия?",
                options: [
                    "Сразу перейти и ввести свой номер",
                    "Переслать всем друзьям",
                    "Спросить друга лично, не взломали ли его",
                    "Удалить мессенджер"
                ],
                correct: 2
            },
            {
                q: "Как понять, что сайт безопасен для ввода данных?",
                options: [
                    "На сайте много яркой рекламы",
                    "Адрес начинается с https:// и есть замочек",
                    "Сайт открывается очень быстро",
                    "На сайте нет картинок"
                ],
                correct: 1
            },
            {
                q: "Что такое двухфакторная аутентификация (2FA)?",
                options: [
                    "Вход по паролю + коду из СМС/приложения",
                    "Использование двух антивирусов",
                    "Вход с двух телефонов одновременно",
                    "Проверка экрана на царапины"
                ],
                correct: 0
            }
        ];

        let currentQ = 0;
        let score = 0;
        let canAnswer = true;

        function showQuestion() {
            canAnswer = true;
            const q = questions[currentQ];
            document.getElementById('question-text').innerText = `${currentQ + 1}. ${q.q}`;
            document.getElementById('progress').style.width = `${(currentQ / questions.length) * 100}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                container.appendChild(btn);
            });
        }

        function selectOption(index, btn) {
            if (!canAnswer) return;
            canAnswer = false;

            const correctIdx = questions[currentQ].correct;
            const buttons = document.querySelectorAll('.option-btn');

            if (index === correctIdx) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                buttons[correctIdx].classList.add('correct');
            }

            setTimeout(() => {
                currentQ++;
                if (currentQ < questions.length) {
                    showQuestion();
                } else {
                    showResults();
                }
            }, 1200);
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('score-text').innerText = `${score} / ${questions.length}`;

            const gradeElem = document.getElementById('grade-text');
            const feedbackElem = document.getElementById('feedback-text');

            if (score === 5) {
                gradeElem.innerText = "Оценка: 5+";
                gradeElem.style.color = "#28a745";
                feedbackElem.innerText = "Отлично! Ты настоящая кибер-защита!";
            } else if (score >= 3) {
                gradeElem.innerText = "Оценка: 4";
                gradeElem.style.color = "#ffc107";
                feedbackElem.innerText = "Хороший результат, но повтори правила!";
            } else {
                gradeElem.innerText = "Оценка: 3";
                gradeElem.style.color = "#dc3545";
                feedbackElem.innerText = "Будь осторожнее в сети!";
            }
        }

        function restartQuiz() {
            currentQ = 0;
            score = 0;
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            showQuestion();
        }

        showQuestion();
    </script>
</body>
</html>
